name: CI

on:
  push:
    branches: [ main ]

jobs:
  Run-App:
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Run Tests
        run: python -m unittest discover -s tests -v
  
  Run-Python-App:
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Run Python
        run: python src/app.py
